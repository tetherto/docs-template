version: 2
updates:
  # Only raise PRs for MAJOR version updates. Minor/patch bumps are ignored;
  # security updates are unaffected by these ignore rules and still come through.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # directory "/" covers the npm workspaces under packages/* automatically.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
