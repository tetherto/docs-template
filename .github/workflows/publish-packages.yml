name: Publish Packages to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@tetherto"

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGES=(
            "packages/docs-seo-schema"
            "packages/docs-seo-core"
            "packages/docs-seo-next"
            "packages/docs-seo-og"
          )

          for pkg_dir in "${PACKAGES[@]}"; do
            PKG_NAME=$(node -p "require('./$pkg_dir/package.json').name")
            PKG_VERSION=$(node -p "require('./$pkg_dir/package.json').version")

            if npm view "$PKG_NAME@$PKG_VERSION" version --registry https://npm.pkg.github.com 2>/dev/null; then
              echo "Skipping $PKG_NAME@$PKG_VERSION — already published"
            else
              echo "Publishing $PKG_NAME@$PKG_VERSION"
              npm publish --workspace "$pkg_dir"
              echo "Published $PKG_NAME@$PKG_VERSION"
            fi
          done
