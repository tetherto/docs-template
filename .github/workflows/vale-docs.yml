name: Vale documentation lint

on:
  workflow_call:
    inputs:
      filepaths:
        description: "Comma-separated Markdown/MDX globs to lint (root and nested)."
        required: false
        type: string
        default: "*.md,**/*.md,*.mdx,**/*.mdx"
      fail_on_error:
        description: "Set to true to fail CI when Vale reports errors."
        required: false
        type: boolean
        default: false
      docs_template_ref:
        description: "docs-template ref to use as the Vale source of truth."
        required: false
        type: string
        default: main
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'

jobs:
  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Downstream callers (workflow_call) pull the central config from docs-template.
      # When docs-template lints itself on a pull_request, it uses its own local
      # .vale.ini (checked out above), so this step is skipped.
      - name: Checkout central Vale configuration
        if: github.event_name != 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: tetherto/docs-template
          ref: ${{ inputs.docs_template_ref || 'main' }}
          path: .tether-vale-source
          persist-credentials: false

      - name: Detect changed documentation files
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          path: "."
          # tj-actions splits `files` by `files_separator` (default newline); set it to
          # a comma to match our comma-separated globs. Include root (*.md) AND nested
          # (**/*.md) — **/*.md alone does not match root-level files.
          files: ${{ inputs.filepaths || '*.md,**/*.md,*.mdx,**/*.mdx' }}
          files_separator: ","
          # Don't lint vendored Vale style packages (synced by `vale sync`); their
          # READMEs are third-party license text, not our prose.
          files_ignore: styles/Google/**,styles/proselint/**,styles/write-good/**
          files_ignore_separator: ","
          separator: ","

      - name: List changed documentation files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "The following files were detected for Vale:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Vale
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: ${{ steps.changed-files.outputs.all_changed_files }}
          # Self-lint (pull_request) uses the local config; downstream (workflow_call)
          # uses the central config checked out into .tether-vale-source.
          vale_flags: ${{ github.event_name == 'pull_request' && '--config .vale.ini' || '--config .tether-vale-source/.vale.ini' }}
          fail_on_error: ${{ inputs.fail_on_error || false }}
          reporter: github-pr-check
          separator: ","
